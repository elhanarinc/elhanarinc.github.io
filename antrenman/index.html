<html lang="tr">
<head>

<meta name="mobile-web-app-capable" content="yes">

<title>Push/Pull · 4 gün · ≤ 1 saat</title>
<style>
  :root{
    --bg:#f4f1ea; --card:#fffdf8; --ink:#1d1c1a; --mute:#6f6a60; --line:#e3ddd0; --soft:#ebe5d8;
    --fig:#f7f3ea; --eq:#b7ae9c; --grip:#555;
    --push:#d9480f; --pull:#1971c2; --legs:#2b8a3e; --upper:#7048e8;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#141412; --card:#1f1e1b; --ink:#f1ede4; --mute:#a39d90; --line:#34322d; --soft:#2b2925;
      --fig:#282622; --eq:#6f685b; --grip:#cfc8b8;
      --push:#ff7a3d; --pull:#4dabf7; --legs:#51cf66; --upper:#9775fa}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:0 env(safe-area-inset-right) calc(20px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
  button{font-family:inherit}
  header{padding:calc(14px + env(safe-area-inset-top)) 14px 4px;max-width:760px;margin:0 auto}
  h1{font-size:19px;margin:0 0 2px;letter-spacing:-.3px}
  .sub{color:var(--mute);font-size:13px}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 4px}
  .wd{text-align:center;font-size:11px;padding:6px 0;border-radius:8px;background:var(--soft);color:var(--mute)}
  .wd b{display:block;font-size:12px;color:var(--ink)}
  .wd.on,.wd.on b{color:#fff}

  nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:760px;margin:0 auto;padding:8px 10px}
  .tab{border:0;border-radius:12px;min-height:48px;padding:6px 2px;background:var(--soft);color:var(--ink);cursor:pointer;line-height:1.1}
  .tab b{display:block;font-size:15px}
  .tab small{font-size:11px;color:var(--mute)}
  .tab[aria-selected=true]{background:var(--c);color:#fff}
  .tab[aria-selected=true] small{color:#fff;opacity:.9}

  main{max-width:760px;margin:0 auto;padding:10px}
  .panel{display:none}
  .panel.on{display:block}
  .dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:4px 2px 8px}
  .dayhead h2{margin:0;font-size:20px;color:var(--c)}
  .dayhead h2 span{font-weight:500;font-size:14px;color:var(--mute)}
  .dayhead .tot{font-weight:800;font-size:15px;white-space:nowrap}
  .bar{display:flex;height:28px;border-radius:8px;overflow:hidden;font-size:11px;font-weight:700;color:#fff;margin-bottom:6px}
  .bar div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden}
  .note{font-size:13.5px;color:var(--mute);margin:0 2px 12px}
  .sec{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);margin:20px 2px 8px}

  .ex{display:grid;grid-template-columns:104px minmax(0,1fr);grid-template-areas:"fig head" "body body";
    column-gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px}
  .ex svg{grid-area:fig;width:104px;height:92px;background:var(--fig);border-radius:10px}
  .ex .head{grid-area:head;align-self:center}
  .ex .body{grid-area:body}
  .ex h3{margin:0;font-size:17px;line-height:1.2}
  .ex .en{font-size:12.5px;color:var(--mute)}
  .rx{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 0}
  .pill{font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft)}
  .pill.main{background:var(--c);color:#fff}
  .cue{font-size:14px;margin:8px 0 2px}
  .opt{opacity:.85}
  .opt h3::after{content:" · opsiyonel";font-size:12px;color:var(--mute);font-weight:500}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0}
  .card h3{margin:0 0 6px;font-size:17px}
  .card ul{margin:0;padding-left:18px}
  .card li{margin:4px 0;font-size:15px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--mute);font-weight:600}
  td.n{text-align:right;font-weight:800}
  footer{max-width:760px;margin:0 auto;padding:0 14px 20px;color:var(--mute);font-size:12.5px}

  @media (max-width:480px){ .week{display:none} header{padding-bottom:0} .sub{font-size:12px} }
  @media (max-width:360px){ .tab small{display:none} .ex{grid-template-columns:84px minmax(0,1fr)} .ex svg{width:84px;height:75px} }
  @media (min-width:620px){
    .ex{grid-template-columns:160px minmax(0,1fr);grid-template-areas:"fig head" "fig body"}
    .ex svg{width:160px;height:142px;grid-row:span 2}
    .ex .head{align-self:start}
  }
</style>

<body>

<header>
  <h1>Push / Pull · haftada 4 gün · en fazla 1 saat</h1>
  <div class="sub">Makine ağırlıklı. Her hareket 2 × 8-10, sırayla. Önce ağırlık, sonra yürüyüş. Güncellendi: 01.10.2026</div>
  <div class="week" id="week"></div>
</header>

<nav><div class="tabs" id="tabs" role="tablist"></div></nav>
<main id="main"></main>

<footer>Figürler şematiktir. Ağırlığı artırma kuralı ve diğer notlar "Kurallar" sekmesinde.</footer>

<script>
/* ---------- Hareketler ---------- */

const EX = {
  chest:   {ad:"Chest press", en:"Göğüs itiş makinesi", cue:"Kürek kemiklerini geriye sık. Tutacaklar göğüs ortası hizasında. Dirseği tam kilitleme.", fig:"chest", kas:"Göğüs"},
  shoulder:{ad:"Shoulder press", en:"Omuz itiş makinesi", cue:"Sırt pede yaslı, tutacaklar çene hizasından başlar. Omuz ağrırsa ilk bunu hafiflet.", fig:"shoulder", kas:"Ön omuz"},
  lateral: {ad:"Lateral raise", en:"Yana kaldırma (dambıl/kablo/makine)", cue:"Dirsek hafif bükük, omuz hizasına kadar. Sallanma yok, ağırlık hafif ve temiz.", fig:"lateral", kas:"Yan omuz"},
  pushdown:{ad:"Triceps pushdown", en:"Kablo, halat ya da bar", cue:"Dirsekler gövdeye yapışık, yalnız ön kol hareket etsin. Aşağıda 1 sn sık.", fig:"pushdown", kas:"Triceps"},
  pulldown:{ad:"Lat pulldown", en:"Önden çekiş", cue:"Bar üst göğse gelsin, dirsekleri aşağı-arkaya çek. Hafif geriye eğil, sallanma.", fig:"pulldown", kas:"Sırt (kanat)"},
  row:     {ad:"Seated row", en:"Oturarak kablo/makine çekiş", cue:"Göğüs dik. Önce kürekleri geriye sık, sonra dirsekleri çek. Gövdeyle savurma.", fig:"row", kas:"Sırt (orta)"},
  rearfly: {ad:"Reverse pec deck", en:"Arka omuz makinesi", cue:"Göğsün pede dönük otur. Kolları yana aç, arka omzu sık. Hafif ağırlık, yüksek tekrar.", fig:"rearfly", kas:"Arka omuz"},
  legcurl: {ad:"Seated leg curl", en:"Oturarak arka bacak", cue:"Üst ped dizin hemen üstüne sıkı bassın. Topuğu altına çek, yavaş bırak.", fig:"legcurl", kas:"Arka bacak"},
  curl:    {ad:"Biceps curl", en:"Kablo ya da makine", cue:"İstersen. Pulldown ve row biceps'i zaten çalıştırıyor. Dirsek sabit, savurma yok.", fig:"curl", kas:"Biceps"},
  legpress:{ad:"Leg press", en:"Bacak itiş", cue:"Belin pedden kalkmayacak kadar in (diz ~90°). Topuklardan it, tepede dizi kilitleme.", fig:"legpress", kas:"Bacak (bileşik)"},
  calf:    {ad:"Calf raise (leg press'te)", en:"Baldır", cue:"Ayak uçları platformun alt kenarında, dizler düz ama kilitsiz. Tam aşağı esnet, tam yukarı it.", fig:"calf", kas:"Baldır"},
  walk:    {ad:"Eğimli yürüyüş", en:"Incline treadmill", cue:"%8 eğim, 4,5 km/s ile başla. Tutunmadan yürü. Rahat gelince %10 ve 5 km/s.", fig:"walk"}
};

/* ---------- Günler ----------
   Hareketler sırayla yapılır: bir hareketin bütün setleri bitince sıradakine geç. */
const PUSH = [
    {ex:"chest", s:2, r:"8-10", rest:"2 dk"},
    {ex:"shoulder", s:2, r:"8-10", rest:"2 dk"},
    {ex:"legpress", s:2, r:"8-10", rest:"2 dk"},
    {ex:"lateral", s:2, r:"8-10", rest:"60-90 sn"},
    {ex:"pushdown", s:2, r:"8-10", rest:"60-90 sn"},
    {ex:"calf", s:2, r:"8-10", rest:"60-90 sn"}
  ];
const PULL = [
    {ex:"pulldown", s:2, r:"8-10", rest:"2 dk"},
    {ex:"row", s:2, r:"8-10", rest:"2 dk"},
    {ex:"legcurl", s:2, r:"8-10", rest:"90 sn"},
    {ex:"rearfly", s:2, r:"8-10", rest:"60-90 sn"},
    {ex:"curl", s:2, r:"8-10", rest:"60 sn", opt:true}
  ];
const DAYS = [
  {id:"pzt", ad:"Push", tr:"İtiş + ön bacak", gun:"Pazartesi", kisa:"Pzt", c:"--push",
   ozet:"Göğüs, omuz, triceps, ön bacak ve baldır.", blocks:PUSH},
  {id:"sal", ad:"Pull", tr:"Çekiş + arka bacak", gun:"Salı", kisa:"Sal", c:"--pull",
   ozet:"Sırt, arka omuz, arka bacak. Biceps çekişlerden dolaylı çalışıyor.", blocks:PULL},
  {id:"per", ad:"Push", tr:"İtiş + ön bacak", gun:"Perşembe", kisa:"Per", c:"--push",
   ozet:"Pazartesinin aynısı.", blocks:PUSH},
  {id:"cum", ad:"Pull", tr:"Çekiş + arka bacak", gun:"Cuma", kisa:"Cum", c:"--pull",
   ozet:"Salının aynısı.", blocks:PULL}
];

/* ---------- Süre tahmini (dakika) ----------
   Set + dinlenme ≈ 2,5 dk. Makine değişimi toplam ~3 dk.
   Yürüyüş her gün 20 dk. */
const T = {gecis:3, set:2.5};
function sure(day, withOpt){
  let w = 0;
  for (const it of day.blocks){
    if (it.opt && !withOpt) continue;
    w += it.s * T.set;
  }
  w = Math.round(w);
  const yurume = 20;
  return {agirlik:w, yurume, toplam:w + T.gecis + yurume};
}

/* ---------- Şematik figürler ----------
   Her figür: eq = ekipman çizgileri, A/B = başlangıç/bitiş pozu, grips = tutma noktaları.
   Nokta: "ad" (pozdan), [x,y] (sabit) ya da {p,dx,dy} (poza göre kaydırılmış). */
const SEAT = (bx, sy) => [[[bx,36],[bx,sy-2],6],[[bx-2,sy],[bx+44,sy],6],[[bx+22,sy],[bx+22,150],3]];
const FIG = {
  chest:{eq:[...SEAT(58,114),[[150,20],[150,150],4],["wr",[150,60],2.5]],
    A:{h:[70,44],sh:[68,60],el:[74,84],wr:[94,66],hip:[70,108],kn:[102,110],an:[102,146]},
    B:{el:[94,62],wr:[120,62]}, grips:["wr"]},
  shoulder:{eq:[...SEAT(58,114),[[150,4],[150,150],4],["wr",[150,30],2.5]],
    A:{h:[70,44],sh:[68,60],el:[82,74],wr:[84,50],hip:[70,108],kn:[102,110],an:[102,146]},
    B:{el:[80,38],wr:[82,14]}, grips:["wr"]},
  lateral:{front:true, eq:[[[40,152],[160,152],2]],
    A:{h:[100,38],nk:[100,52],sh:[86,56],sh2:[114,56],pv:[100,96],hp:[92,96],hp2:[108,96],kn:[91,122],kn2:[109,122],an:[90,148],an2:[110,148],
       el:[82,80],wr:[80,102],el2:[118,80],wr2:[120,102]},
    B:{el:[62,58],wr:[40,62],el2:[138,58],wr2:[160,62]}, grips:["wr","wr2"], dumb:true},
  pushdown:{eq:[[[150,8],[150,152],4],[[150,14],[130,14],3],[[130,14],"wr",1.5],[[50,152],[165,152],2]],
    A:{h:[102,38],sh:[98,54],el:[100,78],wr:[118,66],hip:[94,96],kn:[98,122],an:[96,148]},
    B:{wr:[106,101]}, grips:["wr"]},
  legcurl:{eq:[[[50,40],[60,106],6],[[58,110],[106,110],6],[[84,110],[84,150],3],[[94,95],[116,95],7],[[106,112],{p:"an",dx:0,dy:6},3]],
    A:{h:[60,44],sh:[62,60],el:[68,84],wr:[80,102],hip:[70,106],kn:[106,106],an:[138,106]},
    B:{an:[108,138]}, pads:[{p:"an",dx:0,dy:6}]},
  pulldown:{eq:[[[60,4],[150,4],4],["wr",[108,4],1.5],[{p:"wr",dx:-16,dy:0},{p:"wr",dx:16,dy:0},4],
      [[80,114],[112,114],6],[[96,114],[96,150],3],[[118,97],[140,97],7]],
    A:{h:[94,44],sh:[96,60],el:[104,38],wr:[108,14],hip:[96,110],kn:[128,108],an:[128,146]},
    B:{el:[86,82],wr:[102,66]}},
  row:{eq:[[[54,114],[96,114],6],[[74,114],[74,150],3],[[126,96],[130,122],6],[[150,80],[150,150],4],["wr",[150,80],1.5]],
    A:{h:[80,48],sh:[76,64],el:[100,68],wr:[124,72],hip:[68,110],kn:[100,94],an:[124,110]},
    B:{h:[74,48],sh:[72,64],el:[54,80],wr:[78,80]}, grips:["wr"]},
  rearfly:{top:true, eq:[[[84,58],[116,58],7],[[100,58],[100,20],2]],
    A:{h:[100,76],sh:[78,86],sh2:[122,86],el:[80,58],wr:[94,34],el2:[120,58],wr2:[106,34]},
    B:{el:[56,84],wr:[32,78],el2:[144,84],wr2:[168,78]}, grips:["wr","wr2"], label:"üstten görünüş"},
  curl:{eq:[[[150,150],[150,152],1],[[40,152],[165,152],2]],
    A:{h:[100,38],sh:[98,54],el:[98,78],wr:[100,102],hip:[96,96],kn:[98,122],an:[96,148]},
    B:{wr:[116,62]}, grips:["wr"], dumb:true},
  legpress:{eq:[[[36,62],[58,122],7],[[58,122],[82,126],6],[[36,152],[165,152],3],[[98,112],[160,50],3],
      [{p:"an",dx:-11,dy:-11},{p:"an",dx:11,dy:11},6]],
    A:{h:[40,58],sh:[48,76],el:[60,98],wr:[72,110],hip:[66,118],kn:[80,84],an:[102,96]},
    B:{kn:[94,96],an:[120,78]}},
  calf:{eq:[[[36,62],[58,122],7],[[58,122],[82,126],6],[[36,152],[165,152],3],[[108,112],[168,52],3],
      [{p:"to",dx:-11,dy:-11},{p:"to",dx:11,dy:11},6]],
    A:{h:[40,58],sh:[48,76],el:[60,98],wr:[72,110],hip:[66,118],kn:[94,96],an:[120,78],to:[113,71]},
    B:{to:[124,68]}},
  walk:{eq:[[[26,148],[168,128],6],[[152,130],[158,62],4],[[158,62],[138,64],4]],
    A:{h:[104,16],sh:[102,30],el:[112,52],wr:[124,66],el2:[94,54],wr2:[92,78],hip:[100,72],kn:[112,102],an:[120,132],kn2:[94,102],an2:[82,136]},
    B:{el:[94,54],wr:[92,78],el2:[112,52],wr2:[124,66],kn:[94,102],an:[82,136],kn2:[112,102],an2:[120,132]}}
};

const NS = "http://www.w3.org/2000/svg";
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
function pose(f, t){
  const P = {};
  for (const k in f.A){
    const a = f.A[k], b = (f.B && f.B[k]) || a;
    P[k] = [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
  }
  return P;
}
function pt(P, p){
  if (typeof p === "string") return P[p];
  if (Array.isArray(p)) return p;
  const q = P[p.p]; return [q[0]+(p.dx||0), q[1]+(p.dy||0)];
}
function limbs(f, P){
  if (f.front) return [["nk","h"],["sh","sh2"],["nk","pv"],["hp","hp2"],["hp","kn"],["kn","an"],["hp2","kn2"],["kn2","an2"],["sh","el"],["el","wr"],["sh2","el2"],["el2","wr2"]];
  if (f.top) return [["sh","sh2"],["sh","el"],["el","wr"],["sh2","el2"],["el2","wr2"]];
  const L = [["sh","el2",1],["el2","wr2",1],["hip","kn2",1],["kn2","an2",1],["sh","h"],["sh","hip"],["hip","kn"],["kn","an"],["an","to"],["sh","el"],["el","wr"]];
  return L.filter(l => P[l[0]] && P[l[1]]);
}
function draw(svg, f, t){
  const P = pose(f, t);
  let s = "";
  for (const e of f.eq){
    const a = pt(P,e[0]), b = pt(P,e[1]);
    s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" style="stroke:var(--eq)" stroke-width="${e[2]||3}" stroke-linecap="round"/>`;
  }
  for (const l of limbs(f,P)){
    const a = P[l[0]], b = P[l[1]];
    s += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" style="stroke:var(--c)" stroke-width="${l[2]?5:6}" stroke-linecap="round" opacity="${l[2]?.35:1}"/>`;
  }
  s += `<circle cx="${P.h[0]}" cy="${P.h[1]}" r="10" style="fill:var(--fig);stroke:var(--c)" stroke-width="5"/>`;
  for (const g of (f.grips||[])){
    const q = P[g];
    s += f.dumb
      ? `<rect x="${q[0]-7}" y="${q[1]-3}" width="14" height="6" rx="2" style="fill:var(--grip)"/>`
      : `<circle cx="${q[0]}" cy="${q[1]}" r="4" style="fill:var(--grip)"/>`;
  }
  for (const p of (f.pads||[])){
    const q = pt(P,p);
    s += `<circle cx="${q[0]}" cy="${q[1]}" r="6" style="fill:var(--eq)"/>`;
  }
  if (f.label) s += `<text x="90" y="154" text-anchor="middle" font-size="11" style="fill:var(--mute)">${f.label}</text>`;
  svg.innerHTML = s;
}

/* ---------- Sayfa ---------- */
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const main = document.getElementById("main"), tabs = document.getElementById("tabs");

function exCard(day, it, prefix, opt){
  const e = EX[it.ex], el = document.createElement("div");
  el.className = "ex" + (opt ? " opt" : "");
  const pills = it.s ? `<span class="pill main">${it.s} × ${it.r}</span>` : "";
  const restPill = it.rest ? `<span class="pill">dinlenme ${it.rest}</span>` : "";
  el.innerHTML = `
    <svg viewBox="0 0 180 160" data-fig="${e.fig}" aria-hidden="true"></svg>
    <div class="head">
      <h3>${prefix ? prefix+" · " : ""}${e.ad}</h3>
      <div class="en">${e.en}</div>
      <div class="rx">${pills}${restPill}${it.extra||""}</div>
    </div>
    <div class="body">
      <div class="cue">${e.cue}</div>
    </div>`;
  return el;
}

function panel(day){
  const p = document.createElement("section");
  p.className = "panel"; p.id = "p-"+day.id; p.style.setProperty("--c", css(day.c));
  const t = sure(day, false), tOpt = sure(day, true);
  const optNote = tOpt.agirlik !== t.agirlik ? `. Biceps eklersen ≈ ${tOpt.toplam} dk` : "";
  const pct = x => (x / 60 * 100) + "%";
  p.innerHTML = `
    <div class="dayhead"><h2>${day.gun} · ${day.ad} <span>${day.tr}</span></h2>
      <span class="tot">≈ ${t.toplam} dk</span></div>
    <div class="bar">
      <div style="width:${pct(t.agirlik+T.gecis)};background:var(--c)">ağırlık ≈ ${t.agirlik+T.gecis} dk</div>
      <div style="width:${pct(t.yurume)};background:#495057">yürüyüş ${t.yurume}</div>
    </div>
    <p class="note">${day.ozet} Toplam ≈ ${t.toplam} dk, 60 dk sınırının içinde${optNote}.</p>
    <div class="sec">1 · Ağırlık, sırayla (≈ ${t.agirlik+T.gecis} dk)</div>
    <p class="note">Bir hareketin bütün setlerini bitir, sonra sıradakine geç.</p>`;
  day.blocks.forEach((it, i) => p.appendChild(exCard(day, it, String(i+1), it.opt)));

  const s2 = document.createElement("div");
  s2.className = "sec"; s2.textContent = `2 · Yürüyüş (${t.yurume} dk)`;
  p.appendChild(s2);
  p.appendChild(exCard(day, {ex:"walk", extra:`<span class="pill main">${t.yurume} dk</span><span class="pill">%8 · 4,5 km/s → %10 · 5 km/s</span>`}, "", false));
  return p;
}

/* Haftalık set sayısı (yalnız çalışma setleri, opsiyonel hariç) */
function volume(){
  const v = {};
  for (const d of DAYS) for (const it of d.blocks){ if (it.opt) continue;
    const k = EX[it.ex].kas; v[k] = (v[k]||0) + it.s; }
  return Object.entries(v).sort((a,b)=>b[1]-a[1]);
}

function rulesPanel(){
  const p = document.createElement("section");
  p.className = "panel"; p.id = "p-kurallar"; p.style.setProperty("--c", "#495057");
  p.innerHTML = `
    <div class="card"><h3>Hafta düzeni</h3><ul>
      <li><b>Pzt</b> Push · <b>Sal</b> Pull · <b>Çar</b> dinlen · <b>Per</b> Push · <b>Cuma</b> Pull · hafta sonu yok.</li><li>Ayrı bacak günü yok: leg press push günlerinde, leg curl pull günlerinde.</li>
      <li>Bir gün kaçarsa sırayı bozma, kaldığın günden devam et (ör. Salı gidemedin → Çarşamba Pull, Perşembe Push).</li>
      <li>Üst üste iki gün farklı kas çalıştığı için sorun değil.</li>
    </ul></div>
    <div class="card"><h3>Her set nasıl olmalı</h3><ul>
      <li>Son tekrar zor gelsin, <b>0-2 tekrar kalsın</b>. Tam tükenişe gitmek gerekmiyor.</li>
      <li><b>İlerleme:</b> bütün setlerde aralığın üst sınırına ulaşınca (2×10) bir sonraki ağırlığa geç, tekrar alt sınırdan başla.</li>
    </ul></div>
    <div class="card"><h3>Salon doluysa</h3><ul>
      <li>Sıradaki makine doluysa boş olan bir sonraki hareketi öne al, sonra geri dön.</li>
      <li>Vakit daralırsa önce son hareketi 1 sete indir ya da atla. İlk iki hareketi kısma.</li>
      <li>Yürüyüş her gün 20 dk. Ağırlık uzarsa yürüyüşten kıs, toplam 1 saati geçmesin.</li><li>Gelişme durursa önce ana hareketlere 3. set ekle.</li>
    </ul></div>
    <div class="card"><h3>Makinede ağırlık bitince</h3><ul>
      <li>1) Tek kol / tek bacak yap (tek kol pulldown, tek kol row, tek bacak leg press).</li>
      <li>2) Daha büyük ya da plaka yüklemeli makineye geç.</li>
      <li>3) Hareketi kabloya taşı.</li>
      <li>4) Olmazsa tekrarı 15-30'a çıkar, son sete rest-pause ekle (tükenişe git, 15 sn dinlen, 3-5 tekrar daha).</li>
    </ul></div>
    <div class="card"><h3>Haftalık çalışma seti (kas başına)</h3>
      <table><tr><th>Kas</th><th style="text-align:right">set/hafta</th></tr>
      ${volume().map(([k,n])=>`<tr><td>${k}</td><td class="n">${n}</td></tr>`).join("")}</table>
      <p class="note" style="margin-top:8px">Biceps ayrıca pulldown ve row üzerinden dolaylı çalışıyor.</p>
    </div>`;
  return p;
}

/* Kurulum */
const all = [...DAYS.map(d=>({id:d.id, ad:`<b>${d.kisa}</b><small>${d.ad}</small>`, c:css(d.c), el:panel(d)})),
             {id:"kurallar", ad:"<b>ℹ︎</b><small>Kurallar</small>", c:"#495057", el:rulesPanel()}];
all.forEach(x => {
  main.appendChild(x.el);
  const b = document.createElement("button");
  b.className = "tab"; b.innerHTML = x.ad; b.setAttribute("role","tab"); b.style.setProperty("--c", x.c);
  b.onclick = () => select(x.id);
  x.btn = b; tabs.appendChild(b);
});

const week = document.getElementById("week");
const plan = [["Pzt","pzt"],["Sal","sal"],["Çar",null],["Per","per"],["Cum","cum"],["Cmt",null],["Paz",null]];
plan.forEach(([g,id]) => {
  const d = DAYS.find(x=>x.id===id), el = document.createElement("div");
  el.className = "wd" + (d ? " on" : "");
  if (d){ el.style.background = css(d.c); el.style.cursor = "pointer"; el.onclick = () => select(id); }
  el.innerHTML = `<b>${g}</b>${d ? d.ad : "—"}`;
  week.appendChild(el);
});

let active = null;
function select(id){
  active = id;
  all.forEach(x => { const on = x.id === id; x.el.classList.toggle("on", on); x.btn.setAttribute("aria-selected", on); });
  history.replaceState(null, "", "#"+id);
  window.scrollTo({top:0});
}
const dow = new Date().getDay(); // 0 Paz
const h = location.hash.slice(1);
if (all.some(x=>x.id===h)) select(h); else select({1:"pzt",2:"sal",3:"per",4:"per",5:"cum"}[dow] || "pzt"); // Çar → yarının günü, hafta sonu → Pzt

/* Animasyon: yalnız açık sekmedeki figürler */
const svgs = [...document.querySelectorAll("svg[data-fig]")];
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(ms){
  const cyc = (ms % 3000) / 3000;               // 3 sn döngü: kalk, bekle, in, bekle
  const t = cyc < .35 ? ease(cyc/.35) : cyc < .5 ? 1 : cyc < .85 ? 1-ease((cyc-.5)/.35) : 0;
  svgs.forEach(s => { if (s.closest(".panel.on")) draw(s, FIG[s.dataset.fig], still ? 1 : t); });
  if (!still) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
